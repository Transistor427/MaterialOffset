########################################
# MATERIAL OFFSET configuration
########################################

[material_offset]
# Optional sensor object overrides (Klipper object names):
# extruder_sensor: extruder
# bed_sensor: heater_bed
# chamber_sensor: heater_generic chamber

# Presets: specify only the heaters you care about (extruder, bed, chamber).
# Unspecified heaters are ignored when matching.
# A more specific preset (extra heater constraint) may overlap a broader one.
# Example: ABS (no chamber) and ABS HT (same extruder/bed + chamber) is valid;
# when chamber temperature matches ABS HT, that preset is preferred.

[material_offset PLA]
offset: -0.05
extruder: 190:220
bed: 0:69

[material_offset PETG]
offset: -0.07
extruder: 220:250
bed: 70:89

[material_offset ABS]
offset: -0.09
extruder: 220:260
bed: 90:110

[material_offset ABS_HT]
offset: -0.12
extruder: 220:260
bed: 90:110
chamber: 50:70

[gcode_macro change_material_offset]
description: Нажатие активирует или отключает функцию контроля высоты первого слоя 
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if not svv.change_material_offset %}
    RESPOND PREFIX="[+]" MSG="Контроль высоты первого слоя активирован"
    SAVE_VARIABLE VARIABLE=change_material_offset VALUE=True
  {% else %}
    RESPOND PREFIX="[+]" MSG="Контроль высоты первого слоя отключен"
    SAVE_VARIABLE VARIABLE=change_material_offset VALUE=False
  {% endif %}

[delayed_gcode delayed_change_material_offset]
gcode:
  SAVE_VARIABLE VARIABLE=change_material_offset VALUE=False
initial_duration: 0.5
