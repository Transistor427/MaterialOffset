[material_offset]
# Optional sensor object overrides (Klipper object names):
# extruder_sensor: extruder
# bed_sensor: heater_bed
# chamber_sensor: heater_generic chamber

# Presets: specify only the heaters you care about (extruder, bed, chamber).
# Unspecified heaters are ignored when matching.
# A more specific preset (extra heater constraint) may overlap a broader one.
# Example: ABS (no chamber) and ABS HT (same extruder/bed + chamber) is valid;
# when chamber temperature matches ABS HT, that preset is preferred.

[material_offset pla]
offset: -0.05
extruder: 190:220
bed: 0:65

[material_offset abs]
offset: -0.09
extruder: 220:260
bed: 90:110

[material_offset abs_ht]
offset: -0.12
extruder: 220:260
bed: 90:110
chamber: 50:70
